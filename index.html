<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#070b16">
    <meta name="description" content="수업용 인터랙티브 슬라이드 모음">
    <title>PPT 205 · 인터랙티브 수업 자료</title>
    <link rel="icon" href="shared/favicon.svg" type="image/svg+xml">
    <style>
        :root { color-scheme: dark; font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; color: #f7f9ff; background: radial-gradient(circle at 78% 5%, rgba(34,182,255,.16), transparent 31%), #070b16; }
        main { width: min(1120px, calc(100% - 40px)); margin: 0 auto; padding: 76px 0 90px; }
        header { display: grid; grid-template-columns: 1fr auto; gap: 40px; align-items: end; padding-bottom: 48px; border-bottom: 1px solid #2b3a57; }
        .brand { color: #22b6ff; font-size: 14px; font-weight: 900; letter-spacing: .16em; }
        h1 { max-width: 760px; margin: 16px 0 0; font-size: clamp(46px, 7vw, 88px); line-height: .98; letter-spacing: -.065em; }
        header p { max-width: 300px; margin: 0; color: #adbbd2; font-size: 18px; line-height: 1.55; }
        .deck-list { display: grid; gap: 0; margin-top: 44px; }
        .deck-link { display: grid; grid-template-columns: 90px 1fr auto; gap: 26px; align-items: center; padding: 30px 8px; border-bottom: 1px solid #273653; color: inherit; text-decoration: none; transition: background .18s ease, padding .18s ease; }
        .deck-link:hover, .deck-link:focus-visible { padding-inline: 22px; background: #101c32; outline: 0; }
        .deck-index { color: #22b6ff; font: 800 20px "Cascadia Code", monospace; }
        .deck-link h2 { margin: 0 0 7px; font-size: clamp(26px, 3.6vw, 42px); letter-spacing: -.045em; }
        .deck-link p { margin: 0; color: #aebbd0; font-size: 17px; }
        .arrow { color: #22b6ff; font-size: 34px; }
        footer { margin-top: 52px; color: #70809c; font-size: 14px; }
        code { color: #ffd166; }
        @media (max-width: 700px) { header { grid-template-columns: 1fr; } .deck-link { grid-template-columns: 48px 1fr auto; gap: 12px; } header p { max-width: none; } }
    </style>
    <script src="shared/catalog.js" defer></script>
</head>
<body>
    <main>
        <header>
            <div><div class="brand">PPT · 205</div><h1>움직이고 반응하는<br>수업 자료</h1></div>
            <p>브라우저에서 바로 발표하고, 실험하고, 학생과 함께 조작하는 인터랙티브 슬라이드 모음입니다.</p>
        </header>
        <section class="deck-list" data-deck-list aria-label="수업 자료 목록">
            <a class="deck-link" href="Ease/">
                <span class="deck-index">01</span>
                <span><h2>이징 함수로 움직임 디자인하기</h2><p>중학생 · 엔트리 · 90분 · 실제 .ent 실습 포함</p></span>
                <span class="arrow" aria-hidden="true">→</span>
            </a>
        </section>
        <footer>키보드 ← →로 이동 · <code>F</code> 전체 화면 · <code>N</code> 발표자 노트</footer>
    </main>
</body>
</html>
